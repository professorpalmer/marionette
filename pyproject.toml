[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-harness"
version = "0.9.400"
description = "Research rig: which LLMs can drive Puppetmaster as a native harness layer"
requires-python = ">=3.9"
dependencies = [
    "pypdf",
    # Runtime ownership: a standalone `pip install pm-harness` must pull the
    # pinned Puppetmaster bridge. Desktop/Electron still re-checks the same pin.
    "puppetmaster-ai==1.22.43",
]

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.5",
]

[tool.setuptools.packages.find]
include = ["pmharness*", "harness*"]

[tool.setuptools.package-data]
harness = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires real network access",
    "swarm: test drives real Puppetmaster (slow subprocess spawns)",
    "full_auto_safety: offline full-auto safety invariants (Wave 6 CI gate)",
    "resource_soak: optional FD/RSS cleanup soak (manual/CI opt-in)",
]
