appId: com.marionette.app
productName: Marionette
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist/**/*
  - electron/**/*
  - "!electron/**/*.test.cjs"
  - node_modules/**/*
# Generate latest*.yml (+ blockmap) metadata so electron-updater can find
# GitHub Release assets. Publish itself is done by .github/workflows/release.yml
# via `gh release upload`; electron-builder still needs this block to emit the
# feed files under webapp/release/ during `npm run dist`.
publish:
  provider: github
  owner: professorpalmer
  repo: marionette
  releaseType: release
protocols:
  - name: Marionette
    schemes:
      - marionette
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # zip is required for Squirrel.Mac / latest-mac.yml generation.
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: "${productName}-${version}-Setup.${ext}"
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  artifactName: "${productName}-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
