name: tests

# Fast dev-into-main gate. Wall clock target is ~5 minutes:
# Ubuntu 3.9 with xdist, Windows 3.9 split into 4 shards, frontend-build.
# The 3.9 floor and one Windows cell stay required. macOS, 3.11, and the
# million-token soak live in tests-full.yml (nightly / manual).
#
# Push to main reuses a successful tests run for the same git tree
# (dev-into-main PR). Re-running the suite on the merge SHA is a second
# flake lottery on identical bytes. A conflict-resolution tree with no
# match fails closed and runs the matrix.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-green-tree:
    runs-on: ubuntu-latest
    outputs:
      skip_suite: ${{ steps.gate.outputs.skip_suite }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip the suite when this push tree is already green
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_release_gate.py skip-if-green

  pytest-linux:
    needs: reuse-green-tree
    if: needs.reuse-green-tree.outputs.skip_suite != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install (rig + dev extras + Puppetmaster from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "puppetmaster-ai==1.27.14"

      - name: Run the offline test suite
        run: python -m pytest -q -p no:cacheprovider -n 4 --dist loadscope

  pytest-windows:
    needs: reuse-green-tree
    if: needs.reuse-green-tree.outputs.skip_suite != 'true'
    # CI_WINDOWS_RUNNER swaps GitHub-hosted windows-latest for a faster
    # hosted machine without a new workflow. Unset keeps windows-latest so
    # CI never queues on a missing runner label. Blacksmith labels need a
    # GitHub org (professorpalmer is a user account); do not set the
    # variable until a runner app is actually installed on this repo.
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install (rig + dev extras + Puppetmaster from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "puppetmaster-ai==1.27.14"

      - name: Run the offline test suite (shard)
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/4
        run: python -m pytest -q -p no:cacheprovider

  frontend-build:
    needs: reuse-green-tree
    if: needs.reuse-green-tree.outputs.skip_suite != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install + vitest + Electron unit tests + build
        working-directory: webapp
        env:
          DISPLAY: ":99"
        run: |
          npm ci
          npm test
          xvfb-run -a npm run test:electron
          npm run build

  pmharness-units:
    needs: reuse-green-tree
    if: needs.reuse-green-tree.outputs.skip_suite != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install (rig + dev extras + Puppetmaster from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "puppetmaster-ai==1.27.14"

      - name: Run offline pmharness/intent/registry units
        run: python -m pytest -q -p no:cacheprovider tests/test_intent.py tests/test_registry.py tests/test_registry_wizard.py tests/test_pilot_driver_templates.py

