name: release

# Thin Electron shell installers. The packaged app bootstraps a source checkout
# on first launch; it does NOT bundle Python or a PyInstaller backend.
#
# Dest->main PRs start installer builds in parallel with tests.yml. A v* tag
# publishes only after a successful `tests` workflow exists for this git tree
# (commit or same-tree dest PR). release.yml does not re-run pytest.

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Operational pin (installers inherit Puppetmaster from the checkout).
# Kept here so desktop/CI pin-parity tests stay honest.
env:
  PUPPETMASTER_SPEC: puppetmaster-ai==1.22.20

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-already-green:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a successful tests workflow for this tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_release_gate.py require-green

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python (tag adopt)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reuse same-tree installers from dest PR
        id: reuse
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/ci_release_gate.py adopt-installers \
               --platform "${{ matrix.platform }}" \
               --out webapp/release; then
            echo "adopted=true" >> "$GITHUB_OUTPUT"
          else
            echo "adopted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.reuse.outputs.adopted != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install uv (Unix)
        if: steps.reuse.outputs.adopted != 'true' && runner.os != 'Windows'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install uv (Windows)
        if: steps.reuse.outputs.adopted != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: irm https://astral.sh/uv/install.ps1 | iex

      - name: Build renderer + package Electron shell
        if: steps.reuse.outputs.adopted != 'true'
        working-directory: webapp
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          # Dest->main PRs build the installers the tag later adopts. electron-builder
          # skips signing on pull_request unless this is set; unsigned mac zips then
          # fail ShipIt ("code failed to satisfy specified code requirement(s)") on
          # every existing Developer ID install. Fork PRs still cannot sign: GitHub
          # does not expose CSC_* secrets to them.
          CSC_FOR_PULL_REQUEST: ${{ matrix.platform == 'mac' && 'true' || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          npm ci
          # --publish never: emit installers + latest*.yml / blockmap locally.
          # Artifact upload to GitHub Releases is the dedicated `publish` job
          # (avoids matrix races). publish: in electron-builder.yml is still
          # required so the updater feed files are generated.
          npm run dist -- --${{ matrix.platform }} --publish never

      - name: Require Developer ID signature on mac zip
        if: matrix.platform == 'mac'
        shell: bash
        run: python3 scripts/ci_release_gate.py require-mac-signature --dir webapp/release

      - name: Require electron-updater feed metadata
        shell: bash
        run: |
          shopt -s nullglob
          feeds=(webapp/release/latest*.yml)
          if [ ${#feeds[@]} -eq 0 ]; then
            echo "electron-builder did not emit latest*.yml (required by packaged updater)" >&2
            ls -la webapp/release || true
            exit 1
          fi
          printf 'updater feeds:\n'
          printf '  %s\n' "${feeds[@]}"

      # Stage installers as Actions artifacts. Do NOT call the Releases API from
      # the matrix -- three parallel softprops uploads race and flake hard when
      # GitHub returns HTML 503/unicorn pages for /releases.
      - name: Stage installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            webapp/release/*.dmg
            webapp/release/*.zip
            webapp/release/*.exe
            webapp/release/*.AppImage
            webapp/release/*.blockmap
            webapp/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests-already-green, build]
    runs-on: ubuntu-latest
    steps:
      # Checkout so `gh release create --generate-notes` can read git history.
      # Without this, publish only has downloaded artifacts and gh fails with
      # "fatal: not a git repository".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download staged installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Upload assets to GitHub Release (retry on API flakes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Keep the finder free of escaped parens -- Actions wraps this into a
          # temp .sh and `find \( ... \)` has failed with syntax errors.
          mapfile -t ALL < <(find dist -type f | sort)
          FILTERED=()
          for f in "${ALL[@]}"; do
            case "$f" in
              *.dmg|*.zip|*.exe|*.AppImage|*.blockmap|*latest*.yml)
                FILTERED+=("$f")
                ;;
            esac
          done
          if [ "${#FILTERED[@]}" -eq 0 ]; then
            echo "No installer assets found under dist/" >&2
            find dist -type f | head -n 80 || true
            exit 1
          fi
          echo "Uploading ${#FILTERED[@]} asset(s) to $TAG:"
          printf '  %s\n' "${FILTERED[@]}"

          # Ensure the release row exists (notes may already be present).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "release upload attempt ${attempt}/8"
            if gh release upload "$TAG" "${FILTERED[@]}" --clobber; then
              echo "Upload succeeded"
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "Exhausted retries uploading release assets" >&2
          exit 1
